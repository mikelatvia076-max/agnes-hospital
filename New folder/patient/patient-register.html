<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Patient Registration | Agnes Memorial Hospital
</title>

<link rel="stylesheet" href="patient.css">

</head>


<body>


<div class="patient-card">


<h1>
Agnes Memorial Medical Hospital
</h1>


<h2>
Create Patient Account
</h2>



<form id="registerForm">


<input 
type="text"
id="name"
placeholder="Full Name"
required>



<input 
type="email"
id="email"
placeholder="Email Address"
required>



<input 
type="text"
id="phone"
placeholder="Phone Number"
required>



<input 
type="password"
id="password"
placeholder="Create Password"
required>




<button type="submit">

Register

</button>



</form>



<p>

Already have account?

<a href="patient-login.html">
Login
</a>

</p>



</div>
<script src="config.js"></script>

<script src="patients.js"></script>


</body>

</html>
